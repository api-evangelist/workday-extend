openapi: 3.2.0
info:
  title: Workday Extend Workday Graph Graph Query API
  description: Graph API for querying and traversing Workday data using a flexible, graph-based approach. Provides a unified query interface for accessing interconnected Workday business objects and their relationships. Supports Workday Query Language (WQL) for complex data retrieval and GraphQL-style queries across the Workday platform, enabling developers to efficiently access workers, organizations, positions, and other business objects.
  version: v1
  contact:
    name: Workday Developer Support
    url: https://support.developer.workday.com/s/
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://{baseUrl}/api/graphql/v1/{tenant}
  description: Workday Graph API Server
  variables:
    baseUrl:
      default: api.workday.com
    tenant:
      default: tenant
security:
- OAuth2:
  - graph:read
tags:
- name: Graph Query
  description: Operations for querying Workday business objects using the Graph API. Supports flexible field selection and relationship traversal.
paths:
  /query:
    post:
      operationId: executeGraphQuery
      summary: Workday Extend Execute a graph query
      description: Executes a graph query against the Workday data model. Supports field selection, filtering, relationship traversal, and pagination. Returns the requested business objects with only the selected fields.
      tags:
      - Graph Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Successful query response with matching data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    GraphQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: The graph query string specifying the business objects, fields, filters, and relationships to retrieve
        variables:
          type: object
          additionalProperties: true
          description: Variables to substitute into the query. Referenced in the query using the $variableName syntax.
        limit:
          type: integer
          default: 20
          maximum: 100
          description: Maximum number of results to return
        offset:
          type: integer
          default: 0
          description: Number of results to skip for pagination
    GraphQueryResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: The query result data organized by the queried business object types
        total:
          type: integer
          description: Total number of matching records
        hasMore:
          type: boolean
          description: Whether additional results are available beyond the current page
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code identifying the type of error
        message:
          type: string
          description: Human-readable error message
        location:
          type: object
          properties:
            line:
              type: integer
              description: Line number in the query where the error occurred
            column:
              type: integer
              description: Column number in the query where the error occurred
  responses:
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request or query syntax error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{baseUrl}/authorize
          tokenUrl: https://{baseUrl}/oauth2/{tenant}/token
          scopes:
            graph:read: Query Workday data through the Graph API
            graph:schema: Access schema introspection
externalDocs:
  description: Workday Graph API Explorer
  url: https://developer.workday.com/graph-api-explorer
